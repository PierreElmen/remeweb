<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <desc>Re:Me social card with warm gradient background and mindful copy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB380" />
      <stop offset="45%" stop-color="#FF8C42" />
      <stop offset="100%" stop-color="#0E0E0F" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#FFE5D4" stop-opacity="0.85" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="rgba(15,15,16,0.25)" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#0E0E0F" />
  <rect width="1200" height="630" fill="url(#bg)" opacity="0.94" />
  <g filter="url(#shadow)">
    <rect x="120" y="140" width="520" height="360" rx="40" fill="url(#card)" stroke="rgba(45,45,45,0.08)" stroke-width="2" />
    <text x="170" y="240" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="74" font-weight="700" fill="#2D2D2D">Re:Me</text>
    <text x="170" y="320" font-family="SF Pro Text, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" fill="#7A7A7A">Reclaim your time. Stay present. Grow your tree.</text>
    <g transform="translate(170 360)" fill="#FF8C42">
      <rect x="0" y="40" width="180" height="4" rx="2" opacity="0.25" />
      <path d="M84 92c0-30 12-50 36-60-8 22-6 38 8 48-12-4-22-2-28 6 4 10 10 18 18 24-20-4-32-12-34-18z" fill="#FF8C42" opacity="0.7" />
      <path d="M98 95c-2-22 6-42 26-58-6 20-4 34 6 44-10-4-18-2-22 4 4 8 8 14 14 18-16-2-24-8-24-8z" fill="#FFB380" opacity="0.85" />
      <rect x="110" y="88" width="8" height="36" rx="4" fill="#855439" />
    </g>
  </g>
  <text x="760" y="270" font-family="SF Pro Text, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" fill="#FFFFFF" opacity="0.94">Mindful phone companion</text>
  <text x="760" y="320" font-family="SF Pro Text, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.82">
    Commit to intentional breaks, let Screen Time shielding hush distractions, and celebrate weekly streaks and achievements.
  </text>
  <text x="760" y="380" font-family="SF Pro Text, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#FFFFFF" opacity="0.82">
    Local-first by default. Optional iCloud backup. No ads, no tracking—just presence.
  </text>
</svg>
