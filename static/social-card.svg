<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Re:Me — Block distractions. Reclaim your time.</title>
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4C6AB" stop-opacity=".48"/>
      <stop offset=".55" stop-color="#FFFDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1F2326" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#FFFDF8"/>
  <rect width="1200" height="630" fill="url(#warm)"/>
  <circle cx="1000" cy="90" r="250" fill="none" stroke="#7D8467" stroke-opacity=".18"/>
  <circle cx="1000" cy="90" r="174" fill="none" stroke="#7D8467" stroke-opacity=".18" stroke-dasharray="8 12"/>

  <g transform="translate(84 72)">
    <rect width="62" height="62" rx="15" fill="#FFFFFF" filter="url(#shadow)"/>
    <path d="M20 10c11-4 17 4 29 0-6 7-4 13-7 18-5 8-14 11-22 6 1-9 7-16 17-20-9 2-16 7-22 15-3-7-1-14 5-19Z" fill="#59633F"/>
    <path d="M20 40c8-5 19-4 24 3s2 14-7 16c-10 2-20-1-22-8-1-4 1-8 5-11Z" fill="#472B2D"/>
    <path d="M24 40c8 1 14 7 15 16" fill="none" stroke="#FFFDF8" stroke-width="1.7"/>
  </g>
  <text x="166" y="115" fill="#1F2326" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Re:Me</text>

  <text x="84" y="252" fill="#1F2326" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="650" letter-spacing="-4">Block the distractions.</text>
  <text x="84" y="329" fill="#59633F" font-family="Inter, Arial, sans-serif" font-size="70" font-style="italic" font-weight="560" letter-spacing="-4">Reclaim your time.</text>
  <text x="88" y="396" fill="#686A67" font-family="Inter, Arial, sans-serif" font-size="24">Intentional phone-free commitments, protected by Screen Time.</text>

  <g transform="translate(835 95) rotate(3)" filter="url(#shadow)">
    <rect width="270" height="500" rx="45" fill="#181B1D"/>
    <rect x="7" y="7" width="256" height="486" rx="38" fill="#FFFDF8"/>
    <rect x="91" y="16" width="88" height="24" rx="14" fill="#181B1D"/>
    <text x="135" y="96" text-anchor="middle" fill="#59633F" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">DEEP WORK</text>
    <text x="135" y="128" text-anchor="middle" fill="#1F2326" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Find your flow.</text>
    <circle cx="135" cy="264" r="85" fill="none" stroke="#E2E7CE" stroke-width="20"/>
    <path d="M135 179a85 85 0 1 1-54 151" fill="none" stroke="#59633F" stroke-width="20" stroke-linecap="round"/>
    <text x="135" y="270" text-anchor="middle" fill="#1F2326" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="650">32:14</text>
    <text x="135" y="292" text-anchor="middle" fill="#686A67" font-family="Inter, Arial, sans-serif" font-size="9" letter-spacing="1.5">REMAINING</text>
    <rect x="29" y="422" width="212" height="43" rx="13" fill="none" stroke="#D4183D" stroke-opacity=".35"/>
    <text x="135" y="449" text-anchor="middle" fill="#D4183D" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Hold to end commitment</text>
  </g>

  <g transform="translate(87 480)">
    <rect width="158" height="48" rx="15" fill="#59633F"/>
    <text x="79" y="30" text-anchor="middle" fill="#FFFDF8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">7 modes</text>
    <rect x="170" width="184" height="48" rx="15" fill="#FFFFFF" stroke="#7D8467" stroke-opacity=".3"/>
    <text x="262" y="30" text-anchor="middle" fill="#1F2326" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">15–210 minutes</text>
    <rect x="366" width="144" height="48" rx="15" fill="#FFFFFF" stroke="#7D8467" stroke-opacity=".3"/>
    <text x="438" y="30" text-anchor="middle" fill="#1F2326" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">iOS 17+</text>
  </g>
